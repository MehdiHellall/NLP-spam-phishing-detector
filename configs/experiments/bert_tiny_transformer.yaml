name: bert_tiny_transformer
command: train-transformer
dataset:
  source: akshatsharma2/the-biggest-spam-ham-phish-email-dataset-300000
  file: df.csv
model:
  name: google/bert_uncased_L-2_H-128_A-2
split:
  seed: 42
  balance_classes: true
  validation_size: 0.1
  test_size: 0.1
training:
  epochs: 1
  batch_size: 64
  learning_rate: 0.00005
  max_length: 128
outputs:
  metrics: reports/metrics/bert_tiny_transformer_metrics.json
