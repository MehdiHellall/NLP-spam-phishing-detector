[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "email-threat-detector"
version = "0.1.0"
description = "Spam and phishing message classification with classical NLP baselines and transformer experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Mehdi Hellal" }
]
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
baseline = [
  "gensim>=4.3",
  "kagglehub>=0.3",
  "matplotlib>=3.9",
  "nltk>=3.9",
  "seaborn>=0.13",
  "wordcloud>=1.9",
]
transformers = [
  "accelerate>=1.2",
  "datasets>=3.0",
  "evaluate>=0.4",
  "peft>=0.14",
  "torch>=2.4",
  "transformers>=4.47",
]
app = [
  "streamlit>=1.40",
]
tracking = [
  "mlflow>=2.17",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_threat_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
